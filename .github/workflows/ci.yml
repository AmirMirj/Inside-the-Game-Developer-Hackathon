name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-checks:
    name: Insights API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/insights-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/insights-api/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Ruff lint
        run: ruff check app tests
      - name: Import smoke check
        env:
          PYTHONPATH: .
        run: python -c "from app.main import app; print(app.title, app.version)"
      - name: Pytest
        env:
          PYTHONPATH: .
        run: pytest -q

  studio-web:
    name: Studio Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/studio-web/package.json
      - name: Install
        run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
